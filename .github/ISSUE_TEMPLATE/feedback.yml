name: Bug reports and feature requests
description: Report a bug or request a feature
body:
  - type: textarea
    id: content
    attributes:
      label: Details
      description: What happened and how to reproduce it, or the feature you want.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Filled in when opened from "Feedback" in the app.
      render: text
